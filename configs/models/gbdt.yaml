# LightGBM Quantile and Point configuration
name: "gbdt"

quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]

params:
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  random_state: 42
  n_jobs: -1
  verbose: -1

early_stopping_rounds: 30
