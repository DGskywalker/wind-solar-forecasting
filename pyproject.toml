[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "european-wind-solar-forecasting"
version = "0.1.0"
description = "Weather-Driven Wind & Solar Generation Forecasting for Power Markets: Linking Forecast Error to Day-Ahead and Intraday Price Impact"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Principal ML Research Engineer", email = "research@energy-quant.internal"}
]
keywords = [
    "renewable-energy", "nwp", "probabilistic-forecasting",
    "power-markets", "entsoe", "era5", "merit-order", "price-impact"
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "xarray>=2023.10.0",
    "zarr>=2.16.0",
    "duckdb>=0.9.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "torch>=2.1.0",
    "statsmodels>=0.14.0",
    "linearmodels>=5.3",
    "pvlib>=0.10.0",
    "pydantic>=2.5.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "structlog>=23.2.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "cdsapi>=0.6.1",
    "openmeteo-requests>=1.1.0",
    "retry-requests>=2.0.0",
    "entsoe-py>=0.5.10",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mlflow>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "nbformat>=5.9.0",
    "nbclient>=0.9.0",
    "ipykernel>=6.26.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["B008", "E501", "N806", "N803", "N802", "B905", "UP042", "W291", "B023", "F841", "B007"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "cdsapi.*",
    "entsoe.*",
    "pvlib.*",
    "scipy.*",
    "mlflow.*",
    "duckdb.*",
    "plotly.*",
    "matplotlib.*",
    "pandas.*",
    "statsmodels.*",
    "joblib.*",
    "sklearn.*",
    "ngboost.*",
    "nbformat.*",
    "pyarrow.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]
